[project]
name = "deep-web-agent"
version = "0.1.0"
description = "A Playwright-powered web research and QA agent built with Deep Agents."
readme = "README.md"
authors = [
    { name = "David Ojo", email = "conceptcodes@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.19",
    "langchain>=1.4.3",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.12",
    "playwright>=1.63.0",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
]

[project.scripts]
deep-web-agent = "deep_web_agent:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
